<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("wiedzmin-stary-swiat-ui-scale") || "md";
          if (s === "xl") s = "lg";
          if (s === "sm" || s === "md" || s === "lg") {
            document.documentElement.setAttribute("data-ui-scale", s);
          } else {
            document.documentElement.setAttribute("data-ui-scale", "md");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-ui-scale", "md");
        }
      })();
    </script>
    <meta
      name="description"
      content="Pomocnik do planszówki Wiedźmin: Stary Świat — przygotowanie rozgrywki i prowadzenie tury krok po kroku."
    />
    <title>Wiedźmin: Stary Świat — Pomocnik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Figtree:wght@500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <p class="boot-msg">Ładowanie pomocnika…</p>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
