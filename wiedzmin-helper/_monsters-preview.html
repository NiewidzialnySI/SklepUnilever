<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monsters panel preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="http://127.0.0.1:8765/css/styles.css">
<style>
  body { padding: 1.25rem; }
  .preview-wrap { max-width: 980px; margin: 0 auto; }
  .setup-map-embed h3 { margin-top: 0; }
</style>
</head>
<body>
<div class="preview-wrap">
  <section class="panel">
    <div class="setup-map-embed">
      <h3>Oznacz potwory (numery z żetonów)</h3>
      <p class="lead">Dla lasu, gór i wody podaj numer obszaru z odkrytego żetonu — strzałkami albo wpisz. Potem ustaw poziom.</p>
      <div id="out"></div>
    </div>
  </section>
</div>
<script type="module">
  import { defaultBoard, setMonsterForTerrain, monstersPanelHtml } from "http://127.0.0.1:8765/js/board.js";
  const board = defaultBoard();
  setMonsterForTerrain(board, "forest", "wyzima", { level: "I" });
  setMonsterForTerrain(board, "mountain", "ard-modron", { level: "II" });
  setMonsterForTerrain(board, "water", "kaer-seren", { level: "III" });
  document.getElementById("out").innerHTML = monstersPanelHtml(board);
</script>
</body>
</html>
